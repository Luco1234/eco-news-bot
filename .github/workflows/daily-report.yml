name: Daily Environmental Digest

on:
  schedule:
    # Runs at 11:00 UTC daily = 7:00 AM US Eastern (during EDT, Mar-Nov).
    # Adjust the hour if you want a different local delivery time, or if
    # daylight saving shifts things — GitHub Actions cron is always UTC.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py
